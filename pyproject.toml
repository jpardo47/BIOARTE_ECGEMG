[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "bioarte-ecg-emg"
version = "1.0.0"
description = "Adquisicion y sonificacion educativa ECG/EMG local"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pyserial", "PySide6", "pyqtgraph", "pygame"]

[project.optional-dependencies]
test = ["pytest", "ruff"]

[project.scripts]
bioarte = "app.main:main"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
